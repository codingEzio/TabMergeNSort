name: "Z-TabMergeNSort"
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.99.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  "Z-TabMergeNSort":
    type: application
    platform: macOS
    sources:
      - path: "../../../shared/safari-host/HostApp.swift"

      - path: Assets.xcassets
    dependencies:
      - target: "Z-TabMergeNSort Extension"
        embed: true

    info:
      path: Host-Info.plist
      properties:
        CFBundleDisplayName: "Z-TabMergeNSort"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SafariExtensionBundleIdentifier: "app.alex.z-tab-merge-n-sort.extension"
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_NAME: "Z-TabMergeNSort"
        PRODUCT_BUNDLE_IDENTIFIER: "app.alex.z-tab-merge-n-sort"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES

  "Z-TabMergeNSort Extension":
    type: app-extension
    platform: macOS
    sources:
      - path: "../../../shared/safari-host/SafariWebExtensionHandler.swift"

      - path: "../../web-extension"
        excludes: ["_locales", "icons", "src", "ui-fonts", "ui-icons"]
        buildPhase: resources
      - path: "../../web-extension/_locales"
        type: folder
        buildPhase: resources
      - path: "../../web-extension/icons"
        type: folder
        buildPhase: resources
      - path: "../../web-extension/src"
        type: folder
        buildPhase: resources
      - path: "../../web-extension/ui-fonts"
        type: folder
        buildPhase: resources
      - path: "../../web-extension/ui-icons"
        type: folder
        buildPhase: resources
    info:
      path: Extension-Info.plist
      properties:
        CFBundleDisplayName: "Z-TabMergeNSort"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_NAME: "Z-TabMergeNSort Extension"
        PRODUCT_BUNDLE_IDENTIFIER: "app.alex.z-tab-merge-n-sort.extension"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
schemes:
  "Z-TabMergeNSort":
    build:
      targets:
        "Z-TabMergeNSort": all
      runPostActionsOnFailure: true
      postActions:
        - name: Forget Safari Build Copy
          settingsTarget: "Z-TabMergeNSort"
          script: '$SRCROOT/../../../scripts/forget-safari-build-copy.sh "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME" "$HOME/Applications/Z-TabMergeNSort.app"'
    run:
      config: Debug
    archive:
      config: Release
